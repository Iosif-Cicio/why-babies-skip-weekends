<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-label="Six common histogram shapes: skewed left, symmetric, skewed right, uniform, bimodal and multimodal">
    <style>
        .bar { fill: #2a78d6; }
        .base { stroke: #7a7974; stroke-width: 1.5; }
        .label { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; text-anchor: middle; }
        .note { font: 400 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; text-anchor: middle; }
        .ours { fill: none; stroke: #2a78d6; stroke-width: 2; }
    </style>
    <g transform="translate(0,0)">
        <rect class="bar" x="21" y="117" width="18" height="3"/>
        <rect class="bar" x="41" y="115" width="18" height="5"/>
        <rect class="bar" x="61" y="112" width="18" height="8"/>
        <rect class="bar" x="81" y="108" width="18" height="12"/>
        <rect class="bar" x="101" y="102" width="18" height="18"/>
        <rect class="bar" x="121" y="94" width="18" height="26"/>
        <rect class="bar" x="141" y="82" width="18" height="38"/>
        <rect class="bar" x="161" y="65" width="18" height="55"/>
        <rect class="bar" x="181" y="40" width="18" height="80"/>
        <rect class="bar" x="201" y="50" width="18" height="70"/>
        <line class="base" x1="20" x2="220" y1="120" y2="120"/>
        <text class="label" x="120" y="146">Skewed left</text>
    </g>
    <g transform="translate(240,0)">
        <rect class="bar" x="21" y="115" width="18" height="5"/>
